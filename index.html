<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Résumé des veilles</title>
    <meta
      name="description"
      content="Portfolio des veilles technologiques"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero__content container">
        <span class="eyebrow">Portfolio de veille</span>
        <h1>L’ensemble des veilles</h1>
        <div class="hero__meta">
          <span class="badge">32 sujets</span>
          <span class="badge">Technologies web</span>
          <span class="badge">Innovation & digital</span>
        </div>
      </div>
    </header>

    <main class="container page-content">
      <div class="toolbar">
        <label class="search-field" for="veilleSearch">
          <span class="visually-hidden">Rechercher une veille</span>
          <input
            id="veilleSearch"
            type="search"
            placeholder="Rechercher une veille..."
            aria-label="Rechercher une veille"
          />
        </label>
      </div>

      <div class="accordion" id="pwaAccordion"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
